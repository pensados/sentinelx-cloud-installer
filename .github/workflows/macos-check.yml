name: macos-installer-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n install-macos.sh
      - name: Check mode (user) - lint LaunchAgent plist
        run: SENTINELX_CHECK=1 ./install-macos.sh
      - name: Check mode (system) - lint LaunchDaemon plist
        run: SENTINELX_MODE=system SENTINELX_CHECK=1 ./install-macos.sh
